[project]
name = "ai-pair-programmer-mcps"
version = "0.1.0"
description = "AI pair programmer tool"
authors = [{ name = "Ronnasayd Machado" }]
requires-python = ">=3.11"
dependencies = ["fastmcp>=2.0"]

[project.scripts]
skill-loader-mcp = "mcps.skill_loader_mcp:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mcps"]
