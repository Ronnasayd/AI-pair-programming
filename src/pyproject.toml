[tool.poetry]
name = "ai-pair-programmer"
version = "0.1.0"
description = "AI pair programmer tool"
authors = ["Ronnasayd Machado"]
packages = [{ include = "mcps" }]

[tool.poetry.dependencies]
python = "^3.11"
fastmcp = "^2.0"

[tool.poetry.scripts]
skill-loader-mcp = "mcps.skill_loader_mcp:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
