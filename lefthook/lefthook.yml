# Lefthook config — migrated from git-hooks/ (symlinked git hooks).
# Install: `lefthook install` (run once per clone).
# Bypass: `git commit --no-verify` (see lefthook/scripts/commit-msg for why this exists).
#
# NOTE: post-checkout, post-commit, post-merge, post-rewrite hooks still live
# directly in .git/hooks/ and are NOT migrated here yet — protected path,
# content unknown. Migrate those once their source is available.

pre-commit:
  commands:
    format-staged:
      run: uv run --project $AI_PROJECT_ROOT_DIR $AI_PROJECT_ROOT_DIR/lefthook/scripts/format_staged.py

commit-msg:
  commands:
    reject-ai-mentions:
      run: uv run --project $AI_PROJECT_ROOT_DIR $AI_PROJECT_ROOT_DIR/lefthook/scripts/commit-msg {1}
    reject-emoji:
      run: uv run --project $AI_PROJECT_ROOT_DIR $AI_PROJECT_ROOT_DIR/lefthook/scripts/reject-emoji-commit-msg {1}

pre-push:
  commands:
    jest:
      run: $AI_PROJECT_ROOT_DIR/lefthook/scripts/pre-push-jest
    typecheck:
      run: $AI_PROJECT_ROOT_DIR/lefthook/scripts/pre-push-typecheck
