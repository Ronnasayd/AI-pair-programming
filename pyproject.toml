[project]
name = "ai-pair-programming-hooks"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "fastembed", "pyyaml", "tree-sitter-language-pack", "spacy", "langdetect"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pylint>=4.1.2",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]
